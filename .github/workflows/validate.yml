name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Playwright runtime (for the capture test)
        run: node plugins/umd/scripts/umd.mjs doctor --fix
      - name: Referential is valid and generated files are committed
        run: node tools/build.mjs --check
      - name: Tests
        run: node --test tests/
