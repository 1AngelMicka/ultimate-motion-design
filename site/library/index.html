<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliothèque · Ultimate Motion Design</title>
<meta name="description" content="{{COUNT}} styles, prompts et blocs de motion design, filtrés par type de projet, ambiance, rendu et format, avec un aperçu de chaque résultat.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/library.css?v={{VERSION}}">
<script>try{const t=localStorage.getItem("umd-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<a class="skip" href="#grid" data-t="skip">Aller aux résultats</a>
<header class="lt-top">
  <a class="lt-brand" href="../index.html" data-en-href="../en/index.html">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><rect x="2" y="5" width="20" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="12" r="2.5" fill="var(--rec)"/><path d="M13 9.5h6M13 12h4M13 14.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="lt-brand-text"><b data-t="title">Bibliothèque</b><small>Ultimate Motion Design</small></span>
  </a>
  <label class="lt-search">
    <span class="sr" data-t="search">Rechercher</span>
    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" data-ph="searchPh" placeholder="Rechercher : néon, papier, keynote, verre…">
  </label>
  <div class="lt-actions">
    <a class="lt-docs" href="../index.html" data-en-href="../en/index.html" data-t="docs">Documentation</a>
    <button type="button" class="lt-lang">EN</button>
    <button type="button" class="lt-theme" data-al="theme" aria-label="Thème"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg></button>
  </div>
</header>
<nav class="lt-types" data-deslop-ignore="horizontal scroller on phones" data-al="typesLabel" aria-label="Type de projet"></nav>
<div class="lt-body">
  <aside class="lt-filters" id="filters" data-al="filtersLabel" aria-label="Filtres de style">
    <div class="lt-filters-head"><h2 data-t="filters">Filtres</h2><button type="button" class="lt-filters-close" data-al="close" aria-label="Fermer">×</button></div>
    <div class="lt-groups"></div>
    <div class="lt-filters-foot"><button type="button" class="lt-apply"></button></div>
  </aside>
  <main class="lt-main">
    <div class="lt-status">
      <button type="button" class="lt-open-filters" aria-controls="filters" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-t="filters">Filtres</span><span class="lt-nsel"></span></button>
      <p class="lt-count" aria-live="polite"></p>
      <label class="lt-sort"><span data-t="sortBy">Trier par</span><select id="sort"></select></label>
    </div>
    <div class="lt-chips"></div>
    <p class="lt-auto" data-t="autoHint">Pendant /umd:go, ton agent choisit seul dans cette bibliothèque : <code>umd styles match</code> la classe d'après ton brief.</p>
    <ul class="lt-grid" id="grid"></ul>
    <div class="lt-empty" hidden><p data-t="none">Rien ne correspond à ces filtres.</p><button type="button" class="lt-reset" data-t="reset">Tout effacer</button></div>
    <div class="lt-sentinel" aria-hidden="true"></div>
    <noscript><p>La bibliothèque a besoin de JavaScript. Dans un terminal : <code>umd styles &lt;mots&gt;</code>. / The library needs JavaScript. In a terminal: <code>umd styles &lt;words&gt;</code>.</p></noscript>
  </main>
</div>
<div class="lt-scrim" hidden></div>
<dialog class="lt-panel" aria-labelledby="panel-title">
  <div class="lt-panel-head"><h2 id="panel-title"></h2><button type="button" class="lt-panel-close" data-al="close" aria-label="Fermer">×</button></div>
  <div class="lt-panel-body"></div>
</dialog>
<script src="../assets/library.js?v={{VERSION}}" defer></script>
</body>
</html>
