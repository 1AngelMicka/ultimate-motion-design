<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ultimate Motion Design · demo</title>
<!-- Rendered with: node plugins/umd/scripts/umd.mjs capture site/demo/index.html --out site/assets/demo.mp4 --width 1920 --height 1080 --fps 30
     One persistent actor (the red record dot) carries the eye through five beats: prompt → storyboard that renders
     under the playhead → the hero shot opens into the film → the audit draws over it → everything folds into the dot.
     Every value is a pure function of t, so two renders are identical. Fonts: Inter and JetBrains Mono (OFL, ./fonts). -->
<style>
  @font-face { font-family: "Inter"; src: url("fonts/inter-var.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "JB"; src: url("fonts/jetbrains-mono-var.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
  :root { --bg: #0b0b0e; --ink: #f2efe9; --muted: #8a8b93; --line: rgba(242, 239, 233, 0.16); --rec: #ff5a3c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Inter", sans-serif; }
  #stage { position: absolute; inset: 0; transform-origin: 960px 540px; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }

  /* beat 1–2: the prompt */
  #prompt { position: absolute; left: 200px; top: 496px; font: 500 56px/88px "JB", monospace; letter-spacing: -0.01em; white-space: pre; transform-origin: 700px 48px; }
  #prompt .cmd { color: var(--ink); }
  #prompt .arg { color: #b9b6b0; }

  /* beat 3: storyboard */
  #boardWrap { position: absolute; inset: 0; perspective: 1800px; perspective-origin: 960px 420px; }
  #board { position: absolute; left: 312px; top: 236px; width: 1296px; height: 498px; transform-style: preserve-3d; transform-origin: 648px 249px; }
  .card { position: absolute; width: 400px; height: 225px; border-radius: 10px; overflow: hidden; background: #111217; }
  .card canvas { position: absolute; inset: 0; width: 400px; height: 225px; }
  .card .scan { position: absolute; inset: 0; background: #111217; }
  .card svg { position: absolute; inset: 0; overflow: visible; }
  .card rect.outline { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .card .ov { position: absolute; inset: 0; }
  .ov .t { position: absolute; left: 0; right: 0; top: 76px; text-align: center; font: 800 56px/1 "Inter"; letter-spacing: -0.04em; color: var(--ink); }
  .ov .note { position: absolute; width: 74px; height: 48px; border-radius: 6px; background: rgba(242,239,233,.9); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .ov .note::before, .ov .note::after { content: ""; position: absolute; left: 9px; right: 18px; height: 5px; border-radius: 3px; background: rgba(20,20,30,.35); top: 12px; }
  .ov .note::after { top: 25px; right: 32px; }
  .ov .ui { position: absolute; left: 96px; top: 34px; width: 208px; height: 136px; border-radius: 10px; background: rgba(12,14,22,.82); border: 1px solid rgba(242,239,233,.25); }
  .ov .ui i { position: absolute; left: 14px; right: 14px; height: 18px; border-radius: 5px; background: rgba(242,239,233,.16); }
  .ov .ui i.on { background: rgba(255,90,60,.85); right: 70px; }
  .ov .bar { position: absolute; bottom: 52px; width: 34px; border-radius: 4px 4px 0 0; background: rgba(242,239,233,.85); }
  .ov .bar.hi { background: var(--rec); }
  .ov .mark { position: absolute; left: 0; right: 0; top: 84px; text-align: center; font: 700 40px/1 "Inter"; letter-spacing: -0.03em; color: var(--ink); }
  .ov .mark::before { content: ""; display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--rec); margin-right: 12px; vertical-align: 4px; }
  .card .label { position: absolute; left: 16px; bottom: 14px; font: 600 20px/1 "JB", monospace; color: var(--ink); letter-spacing: 0.02em; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }
  .card .label span { color: rgba(242, 239, 233, 0.6); margin-left: 10px; }
  #track { position: absolute; left: 312px; top: 790px; width: 1296px; height: 2px; background: var(--line); transform-origin: 0 50%; }
  #trackFill { position: absolute; left: 312px; top: 790px; width: 1296px; height: 2px; background: var(--rec); transform-origin: 0 50%; }
  .tick { position: absolute; top: 778px; width: 2px; height: 26px; background: var(--line); }
  .tickLabel { position: absolute; top: 818px; font: 500 20px/1 "JB", monospace; color: var(--muted); }

  /* beat 4: the film (clip-path opens from the hero card to the full frame) */
  #film { position: absolute; inset: 0; overflow: hidden; }
  #film canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; transform-origin: 960px 600px; }
  #title { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font: 800 236px/1 "Inter"; letter-spacing: -0.045em; }
  #title .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.01em; }
  #title .m span { display: inline-block; }
  #sub { position: absolute; left: 0; right: 0; top: 610px; text-align: center; font: 400 44px/1.2 "Inter"; letter-spacing: -0.01em; color: rgba(242, 239, 233, 0.92); }
  #sub b { font-weight: 600; color: var(--ink); }

  /* beat 5: the audit draws over the film */
  #hud { position: absolute; inset: 0; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,6,10,.55), rgba(5,6,10,.2) 40%, rgba(5,6,10,.75)); opacity: 0; }
  #hud svg { position: absolute; inset: 0; overflow: visible; }
  #hud .corner { fill: none; stroke: rgba(242, 239, 233, 0.75); stroke-width: 2; }
  #hud .tc { position: absolute; left: 140px; top: 96px; font: 500 30px/1 "JB", monospace; color: var(--ink); }
  #hud .lbl { position: absolute; right: 140px; top: 96px; font: 600 30px/1 "JB", monospace; letter-spacing: 0.18em; color: var(--ink); }
  #checks { position: absolute; left: 140px; bottom: 168px; display: flex; gap: 40px; font: 600 30px/1 "JB", monospace; color: var(--ink); text-shadow: 0 2px 14px rgba(0,0,0,.6); }
  #checks div { display: flex; align-items: center; gap: 12px; }
  #checks i { display: inline-block; width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(242, 239, 233, 0.5); position: relative; }
  #checks i::after { content: ""; position: absolute; left: 9px; top: 4px; width: 8px; height: 15px; border: solid var(--bg); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); opacity: var(--ok, 0); }
  #checks i.ok { background: var(--ink); border-color: var(--ink); --ok: 1; }
  #score { position: absolute; right: 140px; bottom: 150px; text-align: right; font: 650 150px/1 "JB", monospace; text-shadow: 0 4px 30px rgba(0,0,0,.5); letter-spacing: -0.03em; }
  #score small { display: block; font: 500 30px/1 "JB", monospace; color: rgba(242, 239, 233, 0.75); letter-spacing: 0.04em; margin-top: 14px; }
  #auditTrack { position: absolute; left: 140px; right: 140px; bottom: 120px; height: 2px; background: rgba(242, 239, 233, 0.28); }

  /* beat 6: end card */
  #end { position: absolute; inset: 0; }
  #end h1 { position: absolute; left: 0; right: 0; top: 420px; margin: 0; text-align: center; font: 650 112px/1 "Inter"; letter-spacing: -0.035em; }
  #end p { position: absolute; left: 0; right: 0; top: 584px; margin: 0; text-align: center; font: 500 36px/1 "JB", monospace; color: var(--muted); }
  #end p b { color: var(--rec); font-weight: 600; }

  /* the actor */
  #dot { position: absolute; left: 0; top: 0; background: var(--rec); will-change: transform; }
  #halo { position: absolute; left: 0; top: 0; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255, 90, 60, 0.22), rgba(255, 90, 60, 0.07) 55%, transparent); }
  .ring { position: absolute; left: 960px; top: 540px; width: 2px; height: 2px; border-radius: 50%; border: 2px solid rgba(255, 90, 60, 0.55); }
  #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0.07; mix-blend-mode: overlay; pointer-events: none; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="stage">
  <div id="boardWrap"><div id="board"></div></div>
  <div id="ticks"></div>
  <div id="track"></div><div id="trackFill"></div>
  <div id="prompt"><span class="cmd" id="cmd"></span><span class="arg" id="arg"></span></div>
  <div id="film">
    <canvas id="gl" width="1920" height="1080"></canvas>
    <div id="title"></div>
    <div id="sub">Tes notes se rangent <b>toutes seules</b>.</div>
    <div id="shade"></div>
    <div id="hud">
      <svg viewBox="0 0 1920 1080"><path id="corners" class="corner" d=""/></svg>
      <div class="tc" id="tc">00:00:06:12</div>
      <div class="lbl" id="lbl">AUDIT</div>
      <div id="checks"></div>
      <div id="auditTrack"></div>
      <div id="score">0,0<small>/10 · 64 vérifications</small></div>
    </div>
  </div>
  <div class="vignette"></div>
</div>
<div id="end"><h1>Ultimate Motion Design</h1><p><b>/umd:go</b>  ·  plugin Claude Code, open source</p></div>
<div class="ring" id="ring1"></div><div class="ring" id="ring2"></div>
<div id="halo"></div>
<div id="dot"></div>
<canvas id="grain" width="480" height="270"></canvas>
<script>
// ------------------------------------------------------------------ timing helpers (pure functions of t)
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const inOutExpo = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const inCubic = (x) => x * x * x;
const $ = (id) => document.getElementById(id);
window.umdDuration = 13;
const FPS = 30;

// ------------------------------------------------------------------ the film: an aurora shader (WebGL 1)
const gl = $("gl").getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
const FRAG = `precision highp float;
uniform vec2 r; uniform float t; uniform float v;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
void main(){
  vec2 uv=gl_FragCoord.xy/r; vec2 p=(gl_FragCoord.xy-.5*r)/r.y;
  float tt=t*.09+v*2.7;
  vec2 q=vec2(fbm(p*1.3+tt),fbm(p*1.3-tt+4.1));
  vec3 sky=mix(vec3(.01,.012,.03),vec3(.035,.05,.12),smoothstep(-.4,.6,p.y));
  vec3 c1=vec3(.12,.9,.72), c2=vec3(.45,.34,1.), c3=vec3(1.,.42,.36);
  vec3 col=sky;
  for(int k=0;k<3;k++){float fk=float(k);
    float edge=.02+.15*fk-.18+.3*fbm(vec2(p.x*.9+tt*.5+fk*2.1,fk*3.+tt*.2))-.12*q.x;
    float y=p.y-edge;
    float curtain=y>0.?exp(-y*(3.2+fk*1.4)):exp(y*(26.+fk*6.));
    float rays=.35+1.1*pow(fbm(vec2(p.x*11.+q.y*2.+fk*5.,tt*.6+fk)),1.6);
    vec3 hue=mix(c1,c2,smoothstep(-.6,.7,p.x+.4*q.y+fk*.25));
    hue=mix(hue,c3,.18*smoothstep(.15,.5,y)*(1.-fk*.3));
    col+=hue*curtain*rays*(1.45-fk*.35);
    col+=vec3(.75,1.,.9)*pow(curtain,6.)*rays*.35*(1.-fk*.4);}
  float ground=smoothstep(-.31,-.34,p.y+.02*fbm(vec2(p.x*3.,1.)));
  col=mix(col,vec3(.006,.008,.014),ground);
  col+=vec3(.2,.55,.6)*exp(-abs(p.y+.325)*42.)*.18;
  col+=step(.9972,h(floor(gl_FragCoord.xy/2.)))*(1.-ground)*.5*smoothstep(-.1,.4,p.y);
  col*=1.-.45*dot(uv-.5,uv-.5)*2.;
  col=col/(1.+col*.28);
  gl_FragColor=vec4(pow(col,vec3(.92)),1.);
}`;
function program() {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, "attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}"));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(p); gl.useProgram(p);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(p, "a"); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  return { r: gl.getUniformLocation(p, "r"), t: gl.getUniformLocation(p, "t"), v: gl.getUniformLocation(p, "v") };
}
const U = program();
function drawFilm(time, variant, w = 1920, h = 1080) {
  gl.canvas.width = w; gl.canvas.height = h; gl.viewport(0, 0, w, h);
  gl.uniform2f(U.r, w, h); gl.uniform1f(U.t, time); gl.uniform1f(U.v, variant);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ------------------------------------------------------------------ storyboard: six beats, each a real frame of the film
const BEATS = [["01", "Accroche", "0–2 s"], ["02", "Problème", "2–4 s"], ["03", "Produit", "4–6 s"], ["04", "Moment fort", "6–8,5 s"], ["05", "Preuve", "8,5–10 s"], ["06", "Fin", "10–12 s"]];
const HERO = 3;
const board = $("board");
const cards = BEATS.map(([n, name, time], i) => {
  const el = document.createElement("div");
  el.className = "card";
  const col = i % 3, row = Math.floor(i / 3);
  el.style.left = `${col * 448}px`; el.style.top = `${row * 273}px`;
  const c = document.createElement("canvas"); c.width = 800; c.height = 450;
  drawFilm(6 + i * 1.7, 0.3 + i * 0.37, 800, 450);
  c.getContext("2d").drawImage(gl.canvas, 0, 0);
  const scan = document.createElement("div"); scan.className = "scan";
  el.innerHTML = `<svg viewBox="0 0 400 225"><rect class="outline" x="0.75" y="0.75" width="398.5" height="223.5" rx="10" pathLength="100"/></svg>`;
  el.prepend(c); el.insertBefore(scan, el.querySelector("svg"));
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = [
    '<div class="t" style="top:84px;font-size:46px;opacity:.95">Tes notes ?</div>',
    [[40,40,-14],[150,30,9],[250,52,-6],[90,112,12],[205,120,-18],[300,96,7]].map(([x,y,r]) => `<div class="note" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)"></div>`).join(""),
    '<div class="ui"><i style="top:18px"></i><i class="on" style="top:46px"></i><i style="top:74px"></i><i style="top:102px;right:90px"></i></div>',
    '<div class="t">Notio</div>',
    [[96,38],[146,62],[196,84],[246,118]].map(([x,h],k) => `<div class="bar${k===3?" hi":""}" style="left:${x}px;height:${h}px"></div>`).join(""),
    '<div class="mark">Notio</div>',
  ][i];
  el.insertBefore(ov, scan);
  const lab = document.createElement("div"); lab.className = "label"; lab.innerHTML = `${n} · ${name}<span>${time}</span>`;
  el.appendChild(lab);
  board.appendChild(el);
  return { el, scan, outline: el.querySelector("rect"), lab, col, row };
});
gl.canvas.width = 1920; gl.canvas.height = 1080;
const ticks = $("ticks");
for (let i = 0; i <= 6; i++) {
  const x = 312 + i * 216;
  const d = document.createElement("div"); d.className = "tick"; d.style.left = `${x - 1}px`; ticks.appendChild(d);
  const l = document.createElement("div"); l.className = "tickLabel"; l.style.left = `${x - 8}px`; l.textContent = `${i * 2}s`; ticks.appendChild(l);
}

// ------------------------------------------------------------------ title letters, audit checks
const title = $("title");
const letters = "Notio".split("").map((ch) => { const m = document.createElement("span"); m.className = "m"; const s = document.createElement("span"); s.textContent = ch; m.appendChild(s); title.appendChild(m); return s; });
const CHECKS = ["Rythme", "Lisibilité", "Son", "Sécurité", "Licences"];
const checks = CHECKS.map((c) => { const d = document.createElement("div"); d.innerHTML = `<i></i>${c}`; $("checks").appendChild(d); return { row: d, dot: d.querySelector("i") }; });

// ------------------------------------------------------------------ grain: seeded per frame, so renders repeat
const gctx = $("grain").getContext("2d");
const gimg = gctx.createImageData(480, 270);
function grain(frame) {
  let s = (frame * 2654435761) >>> 0;
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; const v = (s >>> 24) & 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gctx.putImageData(gimg, 0, 0);
}

// ------------------------------------------------------------------ the prompt
const CMD = "/umd:go ", ARG = "un film de lancement de 12 s pour Notio";
const cmdEl = $("cmd"), argEl = $("arg");
const measure = document.createElement("span"); measure.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:500 56px/88px JB,monospace;letter-spacing:-0.01em";
document.body.appendChild(measure);
let charW = 0;
const charWidth = () => { if (!charW) { measure.textContent = "M".repeat(40); charW = measure.getBoundingClientRect().width / 40; } return charW; };

// ------------------------------------------------------------------ the actor
const dot = $("dot"), halo = $("halo");
function actor(x, y, w, h, r, glow = 1, opacity = 1) {
  dot.style.width = `${w}px`; dot.style.height = `${h}px`; dot.style.borderRadius = `${r}px`;
  dot.style.transform = `translate(${x - w / 2}px, ${y - h / 2}px)`;
  dot.style.opacity = opacity;
  halo.style.transform = `translate(${x}px, ${y}px) scale(${0.6 + 0.4 * glow})`;
  halo.style.opacity = glow * opacity;
}
const pad = (n) => String(n).padStart(2, "0");

window.umdRender = (t) => {
  const frame = Math.round(t * FPS);
  grain(frame);
  const stage = $("stage");

  // ---------- beat 1–2 (0–3.6 s): the dot is already there; it becomes the caret; the command types itself
  const typed = Math.floor(Math.max(0, t - 1.05) / 0.045);
  cmdEl.textContent = CMD.slice(0, Math.min(typed, CMD.length));
  argEl.textContent = ARG.slice(0, Math.max(0, typed - CMD.length));
  const caretX = 200 - 30 * seg(t, 1, 3.4) + charWidth() * Math.min(typed, CMD.length + ARG.length) + 6;
  const fly = inCubic(seg(t, 3.35, 3.95));                                   // the prompt flies through the camera
  const prompt = $("prompt");
  prompt.style.opacity = 1 - seg(t, 3.6, 3.95);
  prompt.style.transform = `translateX(${-30 * seg(t, 1, 3.4)}px) scale(${1 + 5 * fly})`;
  prompt.style.filter = `blur(${12 * fly}px)`;
  prompt.style.visibility = t < 3.96 ? "visible" : "hidden";

  // ---------- beat 3 (3.6–6.6 s): the storyboard, rendered under the playhead
  const boardIn = outExpo(seg(t, 3.5, 4.3));
  const tilt = 16 * (1 - inOutCubic(seg(t, 5.7, 6.5)));
  board.style.opacity = boardIn * (1 - seg(t, 7.2, 7.6));
  board.style.transform = `translateZ(${-260 * (1 - boardIn)}px) rotateX(${tilt}deg) rotateZ(${-2.2 * (1 - inOutCubic(seg(t, 5.7, 6.5)))}deg)`;
  const ph = 312 + 1296 * inOutCubic(seg(t, 4.0, 5.9));                     // playhead x
  const trackOn = outExpo(seg(t, 3.7, 4.2)) * (1 - seg(t, 6.3, 6.7));
  $("track").style.transform = `scaleX(${trackOn})`; $("track").style.opacity = trackOn;
  $("trackFill").style.transform = `scaleX(${(ph - 312) / 1296})`; $("trackFill").style.opacity = trackOn;
  ticks.style.opacity = trackOn;
  cards.forEach((c, i) => {
    const left = 312 + c.col * 448;
    const k = clamp((ph - left) / 400);                                       // the card renders as the playhead crosses it
    const k2 = outCubic(seg(t, 3.75 + i * 0.07, 4.35 + i * 0.07));
    c.outline.style.strokeDasharray = `${100 * k2} 100`;
    c.scan.style.clipPath = `inset(0 0 0 ${100 * k}%)`;
    c.lab.style.opacity = outCubic(seg(t, 4.0 + c.col * 0.5, 4.5 + c.col * 0.5));
    const hero = i === HERO ? outCubic(seg(t, 5.9, 6.3)) : 0;
    c.outline.style.stroke = hero ? `rgba(255,90,60,${0.4 + 0.6 * hero})` : "";
    c.outline.style.strokeWidth = 1.5 + 2 * hero;
    c.el.style.opacity = i === HERO ? 1 : 1 - 0.65 * outCubic(seg(t, 6.0, 6.5));
  });

  // ---------- beat 4 (6.4–9.3 s): the hero shot opens into the film
  const heroRect = cards[HERO].el.getBoundingClientRect();
  const open = inOutExpo(seg(t, 6.45, 7.35));
  const film = $("film");
  film.style.visibility = t >= 6.3 ? "visible" : "hidden";
  const insetT = lerp(heroRect.top, 0, open), insetL = lerp(heroRect.left, 0, open);
  const insetR = lerp(1920 - heroRect.right, 0, open), insetB = lerp(1080 - heroRect.bottom, 0, open);
  film.style.clipPath = `inset(${insetT}px ${insetR}px ${insetB}px ${insetL}px round ${lerp(10, 0, open)}px)`;
  film.style.opacity = seg(t, 6.3, 6.45);
  if (t >= 6.25) {
    drawFilm(6 + HERO * 1.7 + (t - 6.3) * 0.9, 0.3 + HERO * 0.37);
    $("gl").style.transform = `scale(${1.0 + 0.06 * inOutCubic(seg(t, 6.4, 11.2))})`;
  }
  letters.forEach((s, i) => {
    const k = outExpo(seg(t, 7.15 + i * 0.06, 7.95 + i * 0.06));
    s.style.transform = `translateY(${105 * (1 - k)}%)`;
  });
  title.style.letterSpacing = `${-0.045 + 0.02 * (1 - outExpo(seg(t, 7.15, 8.4)))}em`;
  const subK = outCubic(seg(t, 7.75, 8.45));
  $("sub").style.opacity = subK * (1 - seg(t, 9.15, 9.45));
  $("sub").style.transform = `translateY(${18 * (1 - subK)}px)`;
  const back = inOutCubic(seg(t, 9.1, 9.7));
  title.style.opacity = 1 - 0.35 * back;
  title.style.transform = `translateY(${-150 * back}px) scale(${1 - 0.42 * back})`;
  $("shade").style.opacity = back;

  // ---------- beat 5 (9.3–11.2 s): the audit draws over the film
  const hud = $("hud");
  const hk = outExpo(seg(t, 9.25, 9.85));
  hud.style.opacity = t >= 9.2 ? 1 : 0;
  const L = 80 * hk, m = 88;
  $("corners").setAttribute("d", [[m, m, 1, 1], [1920 - m, m, -1, 1], [m, 1080 - m, 1, -1], [1920 - m, 1080 - m, -1, -1]]
    .map(([x, y, sx, sy]) => `M${x},${y + sy * L}V${y}H${x + sx * L}`).join(""));
  const filmT = 6 + Math.max(0, t - 6.3);
  const ff = Math.floor(filmT * FPS);
  $("tc").textContent = `00:00:${pad(Math.floor(ff / FPS))}:${pad(ff % FPS)}`;
  $("tc").style.opacity = hk; $("lbl").style.opacity = hk;
  const sweep = inOutCubic(seg(t, 9.55, 10.75));
  checks.forEach((c, i) => {
    const on = sweep >= (i + 0.6) / CHECKS.length;
    c.dot.className = on ? "ok" : "";
    c.row.style.opacity = outCubic(seg(t, 9.4 + i * 0.07, 9.8 + i * 0.07));
  });
  const score = 9.2 * outCubic(seg(t, 9.55, 10.8));
  $("score").firstChild.textContent = score.toFixed(1).replace(".", ",");
  $("score").style.opacity = outCubic(seg(t, 9.45, 9.9));
  $("auditTrack").style.transform = `scaleX(${hk})`; $("auditTrack").style.transformOrigin = "0 50%";

  // ---------- beat 6 (11.1–13 s): everything folds into the dot; end card
  const fold = inOutExpo(seg(t, 11.05, 11.75));
  stage.style.transform = `scale(${1 - 0.985 * fold})`;
  stage.style.opacity = 1 - seg(t, 11.55, 11.8);
  stage.style.visibility = t < 11.81 ? "visible" : "hidden";
  const endK = outExpo(seg(t, 11.95, 12.6));
  const drift = seg(t, 11.7, 13);
  const end = $("end");
  end.style.opacity = endK;
  end.querySelector("h1").style.transform = `translateY(${26 * (1 - endK) - 10 * drift}px) scale(${1 + 0.025 * drift})`;
  end.querySelector("p").style.transform = `translateY(${18 * (1 - outExpo(seg(t, 11.9, 12.6))) - 6 * drift}px)`;
  end.querySelector("p").style.opacity = outCubic(seg(t, 11.9, 12.6));

  // ---------- the actor through every beat
  // two soft rings leave the dot like a recording signal (low contrast: never a flash)
  [["ring1", 0], ["ring2", 0.42]].forEach(([id, d]) => {
    const k = seg(t, d, d + 1.1), e = outCubic(k), size = 30 + 620 * e;
    const el = $(id);
    el.style.width = el.style.height = `${size}px`;
    el.style.transform = `translate(${-size / 2}px, ${-size / 2}px)`;
    el.style.opacity = t < d ? 0 : 0.9 * (1 - k);
  });
  if (t < 0.85) {                                                    // a breathing dot at the centre: frame 0 is a composition
    const b = 1 + 0.12 * Math.sin(t * 6.5);
    actor(960, 540, 32 * b, 32 * b, 16 * b, 1.1 - 0.2 * Math.cos(t * 6.5));
  } else if (t < 1.25) {                                             // it slides to the prompt and becomes the caret
    const k = inOutExpo(seg(t, 0.85, 1.25));
    actor(lerp(960, 206, k), 540, lerp(30, 12, k), lerp(30, 66, k), lerp(15, 3, k), 1 - 0.5 * k);
  } else if (t < 3.45) {                                             // the caret follows the typing
    actor(caretX, 540, 12, 66, 3, 0.5);
  } else if (t < 4.0) {                                              // the caret becomes the playhead
    const k = inOutExpo(seg(t, 3.45, 4.0));
    actor(lerp(caretX * (1 + 5 * fly), 312, k), lerp(540, 791, k), lerp(12, 22, k), lerp(66, 22, k), lerp(3, 11, k), 0.5 + 0.3 * k);
  } else if (t < 6.0) {                                              // the playhead renders the storyboard
    actor(ph, 791, 22, 22, 11, 0.8);
  } else if (t < 6.45) {                                             // it jumps onto the hero shot
    const k = inOutExpo(seg(t, 6.0, 6.45));
    actor(lerp(1608, heroRect.left + 26, k), lerp(791, heroRect.top + 26, k), 22 - 6 * k, 22 - 6 * k, 11 - 3 * k, 0.8 - 0.3 * k);
  } else if (t < 9.25) {                                             // REC light of the film
    const k = inOutExpo(seg(t, 6.45, 7.35));
    actor(lerp(heroRect.left + 26, 112, k), lerp(heroRect.top + 26, 111, k), 18, 18, 9, 0.45);
  } else if (t < 11.05) {                                            // the audit playhead
    const k = inOutExpo(seg(t, 9.25, 9.6));
    actor(lerp(112, 140 + 1640 * sweep, k), lerp(103, 1080 - 121, k), lerp(16, 20, k), lerp(16, 20, k), 10, 0.45 + 0.4 * k);
  } else if (t < 11.8) {                                             // everything folds into it
    const k = inOutExpo(seg(t, 11.05, 11.75));
    actor(lerp(1780, 960, k), lerp(959, 540, k), lerp(20, 34, k), lerp(20, 34, k), lerp(10, 17, k), 0.85 + 0.15 * k);
  } else {                                                            // the brand mark of the end card
    const k = inOutExpo(seg(t, 11.75, 12.15));
    const b = 1 + 0.05 * Math.sin((t - 11.8) * 3.4);
    actor(960, lerp(540, 360, k), 26 * b, 26 * b, 13 * b, 1 - 0.3 * k);
  }
};
</script>
