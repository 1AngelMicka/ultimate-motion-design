<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>umd demo</title>
<!-- Rendered with: node plugins/umd/scripts/umd.mjs capture site/demo/index.html --out site/assets/demo.mp4 --width 1280 --height 720 -->
<style>
  :root { --bg: #121315; --ink: #ecebe8; --muted: #7d8189; --line: #2c2e33; --rec: #ff5a3c; --mono: "Cascadia Code", Consolas, "SF Mono", monospace; --sans: "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; width: 1280px; height: 720px; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--sans); }
  .tc { position: absolute; left: 64px; top: 48px; display: flex; align-items: center; gap: 12px; font: 500 20px/1 var(--mono); color: var(--muted); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--rec); }
  .cmd { position: absolute; left: 64px; top: 168px; font: 600 88px/1 var(--mono); letter-spacing: -0.02em; white-space: pre; }
  .caret { display: inline-block; width: 0.55em; height: 0.9em; margin-left: 4px; vertical-align: -0.08em; background: var(--rec); }
  .track { position: absolute; left: 64px; right: 64px; top: 432px; height: 2px; background: var(--line); }
  .fill { position: absolute; left: 0; top: 0; height: 2px; background: var(--ink); transform-origin: left center; }
  .head { position: absolute; top: -11px; width: 2px; height: 24px; background: var(--rec); }
  .steps { position: absolute; left: 64px; right: 64px; top: 464px; display: grid; grid-template-columns: repeat(7, 1fr); column-gap: 16px; }
  .step { font: 500 24px/1.2 var(--mono); color: var(--muted); opacity: 0; }
  .step b { display: block; width: 8px; height: 8px; margin-bottom: 14px; border-radius: 50%; background: var(--line); }
  .step.on { color: var(--ink); }
  .step.on b { background: var(--ink); }
  .step.now b { background: var(--rec); }
  .out { position: absolute; left: 64px; top: 600px; display: flex; align-items: center; gap: 16px; font: 500 28px/1 var(--mono); opacity: 0; }
  .out svg { width: 32px; height: 32px; }
  .stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .big { position: absolute; right: 72px; top: 156px; width: 640px; height: 130px; overflow: hidden; }
  .big span { position: absolute; right: 0; top: 0; font: 700 96px/1.3 var(--sans); letter-spacing: -0.03em; white-space: nowrap; }
  .big span.accent { color: var(--rec); }
  .out path { fill: none; stroke: var(--rec); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; }
</style>
</head>
<body>
<div class="stage" id="stage">
<div class="tc"><span class="dot"></span><span id="tc">00:00:00:00</span></div>
<div class="cmd"><span id="typed"></span><span class="caret" id="caret"></span></div>
<div class="track"><div class="fill" id="fill"></div><div class="head" id="head"></div></div>
<div class="steps" id="steps"></div>
<div class="out" id="out"><svg viewBox="0 0 32 32"><path id="check" d="M6 17l7 7 13-15"/></svg><span>deliverables/launch-1920x1080.mp4</span></div>
<div class="big" id="big"></div>
</div>
<script>
  // Everything is a pure function of t (seconds): umd capture calls umdRender(t) for every frame.
  window.umdDuration = 7;
  const FPS = 30;
  const steps = ["kickoff", "storyboard", "build", "render", "audit", "fix", "deliver"];
  const stepsEl = document.getElementById("steps");
  steps.forEach((s) => { const d = document.createElement("div"); d.className = "step"; d.innerHTML = `<b></b>${s}`; stepsEl.appendChild(d); });
  const els = [...stepsEl.children];
  const big = document.getElementById("big");
  steps.forEach((s, i) => { const w = document.createElement("span"); w.textContent = s; if (i === steps.length - 1) w.className = "accent"; big.appendChild(w); });
  const words = [...big.children];
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);           // entrance
  const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2); // on-screen move
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const text = "/umd:go";
  const trackW = 1280 - 128;
  window.umdRender = (t) => {
    const f = Math.round(t * FPS);
    const pad = (n) => String(n).padStart(2, "0");
    document.getElementById("tc").textContent = `00:00:${pad(Math.floor(f / FPS))}:${pad(f % FPS)}`;
    // typing, 70 ms per character, caret steady (no blinking: flashes are a safety issue)
    const n = Math.min(text.length, Math.floor(Math.max(0, t - 0.3) / 0.07));
    document.getElementById("typed").textContent = text.slice(0, n);
    document.getElementById("caret").style.opacity = t < 5.6 ? 1 : 1 - seg(t, 5.6, 5.9);
    // playhead sweeps the 7 steps between 1.0 s and 5.2 s
    const p = inOut(seg(t, 1.0, 5.2));
    document.getElementById("fill").style.transform = `scaleX(${p})`;
    document.getElementById("head").style.transform = `translateX(${p * trackW - 1}px)`;
    els.forEach((el, i) => {
      const start = 0.9 + i * 0.09;                          // staggered entrance
      const e = outCubic(seg(t, start, start + 0.45));
      el.style.opacity = e;
      el.style.transform = `translateY(${(1 - e) * 16}px)`;
      const reached = p * 7 >= i + 0.15;
      el.classList.toggle("on", reached);
      el.classList.toggle("now", reached && p * 7 < i + 1.15);
    });
    // the current step, big on the right: one new word every 0.6 s (something new every beat)
    words.forEach((w, i) => {
      const inAt = 1.0 + (i / 7) * 4.2, outAt = 1.0 + ((i + 1) / 7) * 4.2;
      const a = outCubic(seg(t, inAt, inAt + 0.35));
      const b = i === words.length - 1 ? 0 : inOut(seg(t, outAt, outAt + 0.3));
      w.style.transform = `translateY(${(1 - a) * 130 - b * 130}px)`;
      w.style.opacity = a * (1 - b);
    });
    // slow camera push over the whole piece: nothing is ever fully still
    document.getElementById("stage").style.transform = `scale(${1 + 0.03 * (t / 7)})`;
    // deliverable line, check drawn
    const o = outCubic(seg(t, 5.3, 5.8));
    const out = document.getElementById("out");
    out.style.opacity = o;
    out.style.transform = `translateY(${(1 - o) * 12}px)`;
    document.getElementById("check").style.strokeDashoffset = 40 * (1 - outCubic(seg(t, 5.5, 6.0)));
    // the REC dot breathes slowly: life without flashing
    document.querySelector(".dot").style.opacity = 0.75 + 0.25 * Math.cos(t * 2.4);
  };
  umdRender(0);
</script>
</body>
</html>
